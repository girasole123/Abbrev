name: Compile Typst to PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: typst-community/setup-typst@v5
      
      - name: Compile Typst to PDF
        run: typst compile example.typ
      
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v5
        with:
          name: pdf-output
          path: example.pdf
