name: Compile Typst to PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Typst
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/typst/typst/releases/download/v0.11.0/typst-x86_64-unknown-linux-musl.tar.gz | tar xzf -
          sudo mv typst /usr/local/bin/
      
      - name: Compile Typst to PDF
        run: typst compile example.typ
      
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: example.pdf
